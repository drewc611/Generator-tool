ShortDescription: A tiny plugin host that ports legacy front ends to React, Vue, Svelte, or a dependency free custom element.
Description: >-
  portamp reads a legacy front end (Angular, AngularJS, Vue, Knockout,
  Backbone, jQuery, a Windows executable, a WinForms/WPF/VB6/Delphi form, a
  photograph of a screen, or a running app with no source, among many more)
  and emits React, Vue, Svelte, Angular, Lit, or a custom element that
  depends on nothing, with the proofs beside them. This installer packages
  the desktop console shell; the tool itself is a zero dependency Node CLI.
