# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# NOT YET SUBMITTABLE. InstallerUrl and InstallerSha256 below are named
# placeholders, not guessed values -- winget validates the hash against the
# real file, so a fabricated one would only fail loudly at submission time,
# and a matching-looking wrong one is worse than an honest gap. Neither can
# be filled in until a real "v*" tag has been pushed (see docs/PUBLISHING.md
# for why none exists yet): that tag is what makes .github/workflows/release.yml
# build desktop/dist/*.exe for real and attach it to a GitHub Release.
#
# Once that release exists:
#   1. Download the released "portamp Setup <version>.exe".
#   2. sha256sum it and put the real hash below.
#   3. Put the release asset's real download URL below.
#   4. PackageVersion (in this file and the other two) should match
#      desktop/package.json's version, not the npm package's -- winget is
#      packaging the desktop installer, not the CLI.
#   5. Validate with `winget validate --manifest winget/manifests/d/drewc611/portamp/<version>`
#      and `winget install --manifest ...` locally before submitting.
#   6. Submission is a PR into https://github.com/microsoft/winget-pkgs
#      copying this manifests/ tree in -- a separate repo this tool has no
#      access to and should not be pushed to without you reviewing it first.
#      `wingetcreate submit` automates steps 1-3 and opens that PR for you.
PackageIdentifier: drewc611.portamp
PackageVersion: 0.1.0
InstallerLocale: en-US
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: nsis
Scope: user
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
Installers:
  - Architecture: x64
    InstallerUrl: REPLACE_ME_WITH_THE_REAL_RELEASE_ASSET_URL
    InstallerSha256: REPLACE_ME_WITH_THE_REAL_SHA256_OF_THAT_EXACT_FILE
ManifestType: installer
ManifestVersion: 1.6.0
