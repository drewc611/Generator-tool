name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    # Weekly, so a new query release finds this repository without a push.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The extended suite is worth the minutes here: this tool reads
          # somebody else's source, serves files over http, and shells out to a
          # browser, which is most of the shapes the extra queries look for.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
