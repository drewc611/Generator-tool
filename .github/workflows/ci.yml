name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  # Windows runs the suite and the demo. The bash heavy checks stay on linux;
  # what Windows is here to catch is path handling, and the tests are where
  # that lives.
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
      - run: npm run demo

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ matrix.node }}' }

      - name: syntax check every source file
        run: for f in $(find src plugins test -name '*.js'); do node --check "$f"; done

      - name: the core names no framework
        run: |
          if grep -rniE "\b(angular|react|vue|svelte|playwright)\b" src/core/*.js | grep -vE "^\S+: *(\*|//)" ; then
            echo "the core names a framework outside a comment"; exit 1
          fi
          echo "src/core names no framework in code"

      - name: plugins load
        run: node src/cli.js plugins

      # A picture that states a number has to be generated from the thing it
      # counts, or it becomes a claim nobody rechecks. This one said "10 loaded"
      # long after there were more than ten.
      - name: the plugin rack matches the roster
        run: |
          node tools/plugin-rack.mjs
          git diff --exit-code -- media/plugin-rack.svg || {
            echo "media/plugin-rack.svg is stale; run node tools/plugin-rack.mjs"; exit 1;
          }

      # typescript is optional, so the suite has to be green without it first.
      # Where it is missing the AST tests skip and the reader falls back.
      - name: tests, without the optional dependencies
        run: npm test

      - name: pipeline runs end to end, without the optional dependencies
        run: npm run demo

      # Two belts the flags exist for: --offline proves nothing in the demo
      # path reaches for a network, and the ceiling proves the example's
      # honesty debt is counted and bounded, not merely listed.
      - name: the demo holds offline and under the unverified ceiling
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots \
            --out /tmp/gated-demo --offline --max-unverified 14
          test -s /tmp/gated-demo/PORT_NOTES.md

      # The console is part of the run, not beside it: boot it against the
      # demo the previous step wrote and ask it for everything the page asks
      # for. A fixture can drift; the demo cannot.
      - name: the console serves the demo run
        run: |
          node --input-type=module -e "
            const { serve } = await import('./plugins/vis-ui/index.js');
            const quiet = { info() {}, debug() {} };
            const { server, address } = await serve({ outDir: '/tmp/gated-demo', shotsDir: 'example/screenshots', port: 0, log: quiet });
            const health = await fetch(address + '/healthz').then((r) => r.json());
            if (!health.ok || health.files < 1) throw new Error('healthz is not healthy: ' + JSON.stringify(health));
            const reports = await fetch(address + '/reports.json').then((r) => r.json());
            if (!reports.includes('PORT_NOTES.md')) throw new Error('the reports list misses PORT_NOTES.md');
            if ((await fetch(address + '/report?name=PORT_NOTES.md')).status !== 200) throw new Error('the report did not render');
            const first = await fetch(address + '/run.json');
            const again = await fetch(address + '/run.json', { headers: { 'If-None-Match': first.headers.get('etag') } });
            if (again.status !== 304) throw new Error('the poll paid full price twice');
            if ((await fetch(address + '/lib.js')).status !== 200) throw new Error('lib.js did not serve');
            const run = await first.json();
            if (!run.coverage || typeof run.coverage.ported !== 'number') throw new Error('coverage did not reach the console');
            server.close();
            console.log('console: healthz, reports, a rendered report, the 304, lib.js and coverage all answered');
          "

      - name: install the optional reader
        run: npm install --no-save typescript@^5.4.0

      - name: tests, with the typescript reader
        run: npm test

      - name: pipeline runs end to end, with the typescript reader
        run: npm run demo

      # Both readers have to agree, or what a run reports would depend on
      # whether an optional dependency happens to be installed.
      - name: the reader does not change what the run reports
        run: |
          npm run demo 2>&1 | grep -q "1 component(s), 3 call(s), 2 interceptor(s)"

      # One IR, two dialects in, four targets out. If any pair diverges the
      # claim that the middle is framework blind is decoration.
      - name: the same screen written two ways emits the same code
        run: |
          node -e "
            const { translate } = await import('./plugins/output-react/template.js');
            const { toSvelte } = await import('./plugins/output-svelte/print.js');
            const { toVue } = await import('./plugins/output-vue/print.js');
            const { toHtml } = await import('./plugins/output-html/print.js');
            const ng = '<div *ngIf=\"a\">x</div><li *ngFor=\"let o of xs\" (click)=\"p(o)\">{{o.n}}</li>';
            const vue = '<div v-if=\"a\">x</div><li v-for=\"o in xs\" @click=\"p(o)\">{{o.n}}</li>';
            if (translate(ng, { indent: 0 }).jsx !== translate(vue, { indent: 0 }).jsx) throw new Error('react output diverged');
            if (toSvelte(ng).markup !== toSvelte(vue).markup) throw new Error('svelte output diverged');
            if (toVue(ng).markup !== toVue(vue).markup) throw new Error('vue output diverged');
            if (toHtml(ng).markup !== toHtml(vue).markup) throw new Error('html output diverged');
            console.log('angular and vue produce identical react, svelte, vue and html');
          " --input-type=module

      # A string renderer that forgets to escape is an injection in every
      # component it emits. The scan itself lives in the suite, where it can be
      # written against the printer instead of against escaped YAML.
      - name: the custom element emits and parses
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/elem --html true
          test -s /tmp/elem/src/elements/AppOrders.js
          # The port is ESM and is meant to land in a module project. Without
          # this Node 18 reads a bare .js as CommonJS and rejects the imports.
          echo '{"type":"module"}' > /tmp/elem/package.json
          for f in /tmp/elem/src/elements/*.js; do node --check "$f"; done
          # The delegated listener has to sit on the shadow root. On the host it
          # sees a retargeted event and can never find the node that was clicked.
          grep -q "root.addEventListener" /tmp/elem/src/elements/runtime.js
          # A handler inside a loop is useless without the row it belongs to.
          grep -q 'data-on-click' /tmp/elem/src/elements/AppOrders.js || true

      # The client says what goes out. It never says what comes back.
      - name: the api document describes no response it never saw
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/oas --openapi true
          test -s /tmp/oas/openapi.json
          node -e "
            const doc = require('/tmp/oas/openapi.json');
            for (const [path, item] of Object.entries(doc.paths)) {
              for (const [verb, op] of Object.entries(item)) {
                for (const [code, res] of Object.entries(op.responses)) {
                  if (res.schema || res.content) throw new Error('a response schema was invented for ' + verb + ' ' + path + ' ' + code);
                }
              }
            }
            console.log(Object.keys(doc.paths).length + ' path(s), no invented response');
          "

      # Recorded traffic is somebody's real data. A mock carrying it is a copy
      # of that data in a repository.
      - name: no captured value reaches the mocks
        run: |
          node src/cli.js run --src example/nosource --shots test/fixtures/explored --out /tmp/mock --msw true
          test -s /tmp/mock/src/mocks/handlers.js
          echo '{"type":"module"}' > /tmp/mock/package.json
          node --check /tmp/mock/src/mocks/handlers.js
          if grep -rEn "Northwind|Contoso|Fabrikam" /tmp/mock/src/mocks/; then
            echo "a captured value reached the mocks"; exit 1
          fi

      - name: a conformance suite is written from the recorded exploration
        run: |
          node src/cli.js run --src example/nosource --shots test/fixtures/explored --out /tmp/conf
          test -s /tmp/conf/tests/conformance.spec.js
          grep -q "@playwright/test" /tmp/conf/tests/conformance.spec.js
          grep -q "Customer is required" /tmp/conf/tests/conformance.spec.js
          # The wait has to be armed before the action or it can never fire.
          node -e "
            const fs = require('fs');
            const source = fs.readFileSync('/tmp/conf/tests/conformance.spec.js', 'utf8');
            for (const block of source.split('\ntest(').slice(1)) {
              const wait = block.indexOf('waitForRequest');
              const act = block.indexOf('.click()');
              if (wait > -1 && act > -1 && wait > act) throw new Error('a request wait is armed after the action');
            }
            console.log('every request wait is armed before its action');
          "

      - name: the vue reader ports through the pipeline written for angular
        run: |
          node src/cli.js run --src example/legacy-vue --shots example/screenshots --out /tmp/vueout
          grep -q "orders.map(" /tmp/vueout/src/features/OrdersPanel/OrdersPanel.jsx
          if grep -qE "v-if|v-for|v-model" /tmp/vueout/src/features/OrdersPanel/OrdersPanel.jsx; then
            echo "vue syntax survived into the port"; exit 1
          fi
          grep -q "Proxima Nova" /tmp/vueout/PORT_NOTES.md

      - name: the template was translated, not left as a TODO
        run: |
          test -f example/out/src/features/AppOrders/AppOrders.jsx
          grep -q "orders.map(" example/out/src/features/AppOrders/AppOrders.jsx
          grep -q "setQuery(event.target.value)" example/out/src/features/AppOrders/AppOrders.jsx
          if grep -q "TODO port the template" example/out/src/features/AppOrders/AppOrders.jsx; then
            echo "the component body is still a placeholder"; exit 1
          fi

      # The engine enforces this now, so CI asserts the gate fires rather than
      # grepping for the thing the gate exists to catch.
      - name: the endpoint gate fires on a component that hardcodes a path
        run: |
          if node src/cli.js run --src test/fixtures/hardcoded --shots example/screenshots --out /tmp/hc; then
            echo "the endpoint gate did not fire"; exit 1
          fi
          echo "endpoint gate fired as expected"

      - name: the endpoint gate leaves an external link alone
        run: node src/cli.js run --src test/fixtures/externallink --shots example/screenshots --out /tmp/ex

      # A reading that cannot show its evidence is an opinion.
      - name: the app is recognised, and the reading shows its working
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/arch
          test -s /tmp/arch/ARCHITECTURE.md
          test -s /tmp/arch/MODERNIZATION.md
          grep -q "crud-table" /tmp/arch/ARCHITECTURE.md
          grep -q "Every candidate, and what it rested on" /tmp/arch/ARCHITECTURE.md
          # Every decision names the legacy fact that makes it necessary.
          node -e "
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/arch/MODERNIZATION.md', 'utf8');
            const headings = plan.split(/^### /m).slice(1);
            if (!headings.length) throw new Error('the plan proposes nothing');
            for (const section of headings) {
              if (!section.includes('**Because**')) throw new Error('a decision with no premise: ' + section.split('\n')[0]);
              if (!section.includes('**Instead**')) throw new Error('a decision that proposes nothing');
            }
            console.log(headings.length + ' decision(s), each with its evidence');
          "

      # The same reading has to come out of an app with no source at all, or the
      # IR is not doing the job it exists for.
      - name: an app with no source is recognised too
        run: |
          node src/cli.js run --src example/nosource --shots test/fixtures/explored --out /tmp/archb
          test -s /tmp/archb/ARCHITECTURE.md
          grep -qE "crud-table|master-detail" /tmp/archb/ARCHITECTURE.md

      # The uplift exists to raise contrast. A run that lowered one would be
      # worse than no run at all.
      - name: the design uplift never lowers a contrast ratio
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/up
          test -s /tmp/up/src/tokens.modern.js
          test -s /tmp/up/src/tokens.modern.css
          grep -q "prefers-reduced-motion" /tmp/up/src/tokens.modern.css
          node -e "
            const { uplift } = await import('./plugins/dsp-uplift/index.js');
            const { ratio } = await import('./plugins/dsp-a11y/index.js');
            const legacy = {
              size: { xs: 10, sm: 11, md: 13, lg: 18, xl: 28 },
              color: {
                bg: '#FFFFFF', surface: '#FFFFFF', ink: '#555555', inkMuted: '#999999',
                inkFaint: '#CCCCCC', accent: '#5BA4E6', danger: '#E85D5D', warn: '#E8C25D', ok: '#7DD87D',
              },
            };
            const { changes, tokens } = uplift(legacy);
            let raised = 0;
            for (const c of changes) {
              if (c.after < c.before) throw new Error('contrast went down for ' + c.role + ' on ' + c.ground);
              if (!c.kept) raised++;
            }
            if (!raised) throw new Error('a palette this bad should have been corrected');
            // The display size the app chose has to survive the new scale.
            if (tokens.size['2xl'] < 26) throw new Error('the display size was thrown away: ' + tokens.size['2xl']);
            console.log(raised + ' pair(s) raised, none lowered, display size kept');
          " --input-type=module

      # An app that never declared a component still comes out with a route
      # table, boundary proposals and a plan, and nothing invented.
      - name: a jQuery app is inventoried, clustered and planned, never invented
        run: |
          node src/cli.js run --src example/legacy-jquery --shots example/screenshots --out /tmp/jqdemo
          test -s /tmp/jqdemo/WIDGETS.md
          test -s /tmp/jqdemo/BOUNDARIES.md
          grep -q "selector-soup" /tmp/jqdemo/ARCHITECTURE.md
          grep -q "proposals and not results" /tmp/jqdemo/BOUNDARIES.md
          grep -q "Decide the components before writing any of them" /tmp/jqdemo/MODERNIZATION.md
          # An inventory is not a screen: nothing may be emitted from a proposal.
          if ls /tmp/jqdemo/src/features 2>/dev/null | grep -q .; then
            echo "a component was emitted from a proposal"; exit 1
          fi

      # The address bar is half the contract, and the route has to land on the
      # screen the run actually read, by its class name.
      - name: the route table resolves against the run
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/rts
          grep -qF '`<app-orders>`, in this run' /tmp/rts/ROUTES.md
          grep -q "lazy" /tmp/rts/ROUTES.md

      # The whole no source chain, from a recording rather than a live browser.
      - name: a recorded exploration rebuilds the app it explored
        run: |
          node src/cli.js run --src example/nosource --shots test/fixtures/explored --out /tmp/replay
          test -s /tmp/replay/BEHAVIOR_MODEL.md
          test -s /tmp/replay/IMPROVEMENTS.md
          grep -q "/api/v1/orders/:id" /tmp/replay/BEHAVIOR_MODEL.md
          grep -q "Customer is required" /tmp/replay/BEHAVIOR_MODEL.md
          grep -q "a row" /tmp/replay/BEHAVIOR_MODEL.md

      - name: the model describes the product, not somebody's records
        run: |
          if grep -rEn "Northwind|Contoso|Fabrikam" /tmp/replay/BEHAVIOR_MODEL.md /tmp/replay/src; then
            echo "a customer name reached the model"; exit 1
          fi

      - name: the ui serves the last run on loopback, then exits cleanly
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out /tmp/uiout
          node src/cli.js ui --src example/legacy --shots example/screenshots --out /tmp/uiout --port 4399 &
          UI=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4399/run.json && break || sleep 0.3
          done
          curl -sf -o /dev/null http://127.0.0.1:4399/ || { echo "the ui did not serve"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4399/source?path=../../../etc/passwd')" = "403"
          # Nothing outside loopback should ever reach it. `hostname -i` can
          # itself be 127.0.0.1, which would make this pass without testing
          # anything, so the address comes from the interface list.
          node -e "
            const os = require('node:os');
            const ext = Object.values(os.networkInterfaces()).flat()
              .find((a) => a.family === 'IPv4' && !a.internal);
            if (!ext) { console.log('no external IPv4 here, nothing to test'); process.exit(0); }
            fetch('http://' + ext.address + ':4399/', { signal: AbortSignal.timeout(2000) })
              .then((r) => { console.error('the ui answered on ' + ext.address + ' with ' + r.status); process.exit(1); })
              .catch(() => console.log('refused on ' + ext.address + ', as it should be'));
          "
          kill -INT $UI
          wait $UI || true
          ! kill -0 $UI 2>/dev/null || { echo "the ui left a process behind"; exit 1; }
          echo "ui served on loopback and exited on SIGINT"

      - name: the ui added no dependency
        run: |
          node -e "
            const p = require('./package.json');
            if (Object.keys(p.dependencies ?? {}).length) { console.error('a dependency was added'); process.exit(1); }
          "
          if grep -rEn "^import .* from \"(?!node:|\.)" plugins/vis-ui/*.js 2>/dev/null | grep -v "node:" | grep -v 'from "\.'; then
            echo "vis-ui imports something that is not a builtin"; exit 1
          fi

      - name: policy gate stops on a committed secret, and prints nothing
        run: |
          echo 'const c = { client_secret: "sk_live_notarealvalue1234" };' > example/legacy/src/app/leak.ts
          if npm run demo > gate.log 2>&1; then
            echo "policy gate did not fire"; exit 1
          fi
          if grep -q "sk_live_notarealvalue1234" gate.log; then
            echo "the policy engine printed the value it caught"; exit 1
          fi
          rm example/legacy/src/app/leak.ts gate.log
          echo "policy gate fired, and did not print the value"

      - name: every new target emits, and each holds its own honesty rule
        run: |
          node src/cli.js run --src example/legacy --out sprint-out \
            --preact true --solid true --alpine true --cem true --postman true \
            --curl true --fixtures true --portci true --migration true --design-tokens true
          node -e 'JSON.parse(require("fs").readFileSync("sprint-out/postman_collection.json","utf8"))'
          node -e 'const c=JSON.parse(require("fs").readFileSync("sprint-out/postman_collection.json","utf8")); if (JSON.stringify(c).includes("\"response\"")) { throw new Error("postman invented a response"); }'
          node -e 'JSON.parse(require("fs").readFileSync("sprint-out/custom-elements.json","utf8"))'
          for f in sprint-out/fixtures/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
          bash -n sprint-out/smoke.sh
          grep -vq "POST\|DELETE\|PUT" sprint-out/smoke.sh || { echo "the smoke script writes"; exit 1; }
          grep -q "flowchart" sprint-out/MIGRATION_MAP.mmd
          grep -q -- "--size-md" sprint-out/design/tokens.css
          grep -q "role=\"status\"" sprint-out/src/solid/*.jsx || true
          rm -rf sprint-out

      - name: a folder of old pages becomes a React app, and the emitted app holds up
        run: |
          node src/cli.js run --src example/legacy-site --out site-out --site true
          for f in site-out/src/app/match.js site-out/src/app/router.js site-out/src/app/head.js site-out/src/app/nav.js site-out/src/app/redirects.js; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("site-out/redirects.json","utf8"))'
          node -e 'const r=JSON.parse(require("fs").readFileSync("site-out/redirects.json","utf8")); if (!r.some(x=>x.from==="/moved"&&x.to==="/about")) throw new Error("the meta refresh did not become a redirect")'
          grep -q '<main id="main" tabIndex={-1}>{children}</main>' site-out/src/app/Layout.jsx
          if grep -q '<nav' site-out/src/features/Home/Home.jsx; then echo "the page kept chrome the layout owns"; exit 1; fi
          cmp example/legacy-site/logo.svg site-out/public/logo.svg
          node --check site-out/serve.js
          cd site-out && node --test tests/router.test.js tests/server.test.js && cd ..
          rm -rf site-out

      - name: the export is hostable html, the ledger parses, and two runs agree byte for byte
        run: |
          node src/cli.js run --src example/legacy-site --out det-a --site true --export true
          node src/cli.js run --src example/legacy-site --out det-b --site true --export true
          grep -q "<title>About Acme</title>" det-a/export/about/index.html
          grep -q "url=/products" det-a/export/old-shop.html
          node -e 'const l=JSON.parse(require("fs").readFileSync("det-a/LEDGER.json","utf8")); if (!l.decisions.routes.length) throw new Error("an empty ledger records nothing")'
          node -e 'require("fs").readFileSync("det-a/sitemap.xml","utf8").includes("<loc>/about</loc>") || process.exit(1)'
          rm -rf det-a/.portamp det-b/.portamp det-a/HISTORY.md det-b/HISTORY.md
          diff -r det-a det-b
          rm -rf det-a det-b

      - name: a repeated block lifts into one shared component every target composes
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out comp-out --site true --components true
          test -d comp-out/src/features/PortJoinTheNewsletter || { echo "the shared component was not extracted"; exit 1; }
          grep -q "PortJoinTheNewsletter" comp-out/src/features/About/About.jsx || { echo "the page did not compose the component"; exit 1; }
          if grep -q "Join the newsletter" comp-out/src/features/About/About.jsx; then echo "the repeated markup is still inline"; exit 1; fi
          node --check comp-out/serve.js
          rm -rf comp-out

      - name: blocks that share a shape but differ in words are proposed as one with props
        run: |
          node src/cli.js run --src test/fixtures/variant-cards --out props-out --site true
          test -f props-out/PROPS.md || { echo "PROPS.md was not written"; exit 1; }
          grep -qE "href.{0,3}attribute" props-out/PROPS.md || { echo "the varying href was not proposed as a prop"; exit 1; }
          if ls props-out/src/features 2>/dev/null | grep -qE "PortShape|PortThe"; then echo "a parameterized proposal was lifted, but it must not be"; exit 1; fi
          rm -rf props-out

      - name: a Polymer element and a Riot tag port through the unchanged pipeline
        run: |
          node src/cli.js run --src test/fixtures/polymer --out poly-out
          grep -q "user.roles.map(" poly-out/src/features/UserCard/UserCard.jsx || { echo "the dom-repeat did not become a loop"; exit 1; }
          if grep -qE "\[\[|dom-repeat" poly-out/src/features/UserCard/UserCard.jsx; then echo "Polymer syntax leaked into the port"; exit 1; fi
          node src/cli.js run --src test/fixtures/riot --out riot-out
          grep -q "users.map(" riot-out/src/features/UserList/UserList.jsx || { echo "the each did not become a loop"; exit 1; }
          if grep -qE "each=|onclick=" riot-out/src/features/UserList/UserList.jsx; then echo "Riot syntax leaked into the port"; exit 1; fi
          rm -rf poly-out riot-out

      - name: the Qwik and Astro targets emit what each framework requires
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out t-out --qwik true --astro true
          grep -q "component\$((props) =>" t-out/src/qwik/AppOrders/AppOrders.jsx || { echo "qwik component wrapper missing"; exit 1; }
          grep -q "value={query.value}" t-out/src/qwik/AppOrders/AppOrders.jsx || { echo "qwik signal read missing"; exit 1; }
          # Every handler prop must carry its $, or Qwik rejects the build.
          if grep -qE " on(Click|Change|Input|Blur)=\{" t-out/src/qwik/AppOrders/AppOrders.jsx; then echo "a qwik handler lost its \$"; exit 1; fi
          grep -q 'import AppOrders from "../features/AppOrders/AppOrders.jsx"' t-out/src/astro/AppOrders.astro || { echo "astro island does not import the component"; exit 1; }
          grep -q "client:load" t-out/src/astro/AppOrders.astro || { echo "astro island is not hydrated"; exit 1; }
          rm -rf t-out

      - name: the machine facing signals and the trackers are read, values withheld
        run: |
          node src/cli.js run --src test/fixtures/seo-site --out m-out
          grep -q "Organization" m-out/SEO.md || { echo "structured data not read"; exit 1; }
          grep -q "no <title>" m-out/SEO.md || { echo "an SEO gap was not named"; exit 1; }
          grep -q "Facebook Pixel" m-out/ANALYTICS.md || { echo "a tracker was not found"; exit 1; }
          if grep -qE "ABC1234567|123456789012345" m-out/ANALYTICS.md; then echo "a full tracking id was printed"; exit 1; fi
          rm -rf m-out

      - name: portamp reads what it writes, and the round trip holds
        run: |
          node src/cli.js run --src test/fixtures/react-app --out rt-out
          grep -q "product-card" rt-out/ROUNDTRIP.md || { echo "the React component was not read"; exit 1; }
          if grep -q "drifted" rt-out/ROUNDTRIP.md; then echo "a React source did not round trip"; exit 1; fi
          # The example's own screen must round trip without drift.
          node src/cli.js run --src example/legacy --shots example/screenshots --out rt2-out
          grep -q "app-orders" rt2-out/ROUNDTRIP.md || { echo "the screen was not round tripped"; exit 1; }
          if grep -q "drifted" rt2-out/ROUNDTRIP.md; then echo "the emitted React did not read back to its own structure"; exit 1; fi
          rm -rf rt-out rt2-out

      - name: the asset weight is measured and proposed, never applied
        run: |
          node src/cli.js run --src test/fixtures/assets-site --out a-out
          grep -q "hero.jpg" a-out/IMAGES.md || { echo "an image was not weighed"; exit 1; }
          grep -q 'loading="lazy"' a-out/IMAGES.md || { echo "a lazy loading proposal was not named"; exit 1; }
          grep -q "Legacy Serif" a-out/FONTS.md || { echo "a font face was not read"; exit 1; }
          grep -qiE "woff2|invisible|dropped" a-out/FONTS.md || { echo "a font gap was not named"; exit 1; }
          rm -rf a-out

      - name: the modes the old app forgot are read, cookie values withheld
        run: |
          node src/cli.js run --src test/fixtures/modes-site --out mo-out
          grep -q "not honoured" mo-out/MOTION.md || { echo "the unstilled motion was not flagged"; exit 1; }
          grep -qiE "media print|hides chrome" mo-out/PRINT.md || { echo "the print styles were not read"; exit 1; }
          grep -q "session_id" mo-out/COOKIES.md || { echo "a cookie was not named"; exit 1; }
          if grep -qE "abc123|xyz789" mo-out/COOKIES.md; then echo "a cookie value was printed"; exit 1; fi
          rm -rf mo-out

      - name: the meta-frameworks arrange Vue and Svelte, importing not copying
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out mf-out --site true --vue true --nuxt true --svelte true --sveltekit true
          grep -q "src/features/About/About.vue" mf-out/nuxt/pages/about.vue || { echo "nuxt did not import the emitted Vue"; exit 1; }
          grep -q "statusCode: 301" mf-out/nuxt/nuxt.config.ts || { echo "nuxt lost the redirect map"; exit 1; }
          grep -q "src/features/About/About.svelte" mf-out/sveltekit/src/routes/about/+page.svelte || { echo "sveltekit did not import the emitted Svelte"; exit 1; }
          node --check mf-out/sveltekit/src/hooks.server.js
          grep -q "throw redirect(301" mf-out/sveltekit/src/hooks.server.js || { echo "sveltekit lost the redirect hook"; exit 1; }
          rm -rf mf-out

      - name: the port is weighed and drawn, and --max-kb is a real budget
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out sz-out
          grep -q "Component code:" sz-out/SIZE.md || { echo "the port was not weighed"; exit 1; }
          grep -q "flowchart LR" sz-out/GRAPH.md || { echo "the graph was not drawn"; exit 1; }
          rm -rf sz-out
          # A tenth of a kilobyte cannot hold the components, so the budget fires.
          if node src/cli.js run --src example/legacy --shots example/screenshots --out sz2-out --max-kb 0.1; then
            echo "the size budget did not fire"; exit 1
          fi
          rm -rf sz2-out

      - name: the port's sharp edges and its third party code are named, values withheld
        run: |
          node src/cli.js run --src test/fixtures/security-site --out def-out
          grep -q "noopener" def-out/SECURITY.md || { echo "the tabnabbing fix was not proposed"; exit 1; }
          grep -qE "eval|innerHTML|document.write" def-out/SECURITY.md || { echo "a script finding was missed"; exit 1; }
          grep -q "cdn.jsdelivr.net" def-out/SUPPLYCHAIN.md || { echo "an external dependency was not inventoried"; exit 1; }
          grep -qi "integrity" def-out/SUPPLYCHAIN.md || { echo "SRI was not reported"; exit 1; }
          rm -rf def-out

      - name: the port deploys as a container and behind nginx, redirects carried
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out home-out --site true --dockerfile true --nginx true
          grep -q "serve.js" home-out/Dockerfile || { echo "the Dockerfile does not run serve.js"; exit 1; }
          if grep -qE "^\s*RUN\s+npm\s+(ci|install)" home-out/Dockerfile; then echo "the image invented an install the port does not need"; exit 1; fi
          test "$(grep -c 'return 301' home-out/nginx/nginx.conf)" -ge 1 || { echo "nginx lost the redirect map"; exit 1; }
          grep -q "try_files" home-out/nginx/nginx.conf || { echo "nginx has no SPA fallback"; exit 1; }
          rm -rf home-out

      - name: the AWS deploy plan is emitted, carries the redirects, and takes no secrets
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out aws-out --site true --aws true
          test -f aws-out/aws/main.tf || { echo "no terraform plan was written"; exit 1; }
          node --check aws-out/aws/cloudfront-redirects.js || { echo "the CloudFront function does not parse"; exit 1; }
          grep -qiE "cloudfront|s3" aws-out/aws/main.tf || { echo "the plan names no S3 or CloudFront"; exit 1; }
          if grep -rniE "AKIA[0-9A-Z]{12,}|aws_secret_access_key\s*=\s*[\"'][^\"']" aws-out/aws; then echo "the plan leaked a credential"; exit 1; fi
          rm -rf aws-out
          node src/cli.js run --src test/fixtures/repeat-site --out noaws-out --site true
          test -d noaws-out/aws && { echo "the aws plan ran unrequested"; exit 1; }
          rm -rf noaws-out

      - name: the GCP and Azure deploy plans emit, carry the redirects, and take no secrets
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out gcp-out --site true --gcp true
          test -f gcp-out/gcp/main.tf || { echo "no gcp terraform plan"; exit 1; }
          grep -qiE "storage|cdn" gcp-out/gcp/main.tf || { echo "the gcp plan names no storage or CDN"; exit 1; }
          if grep -rniE "private_key|BEGIN [A-Z ]*PRIVATE KEY|service_account.*key" gcp-out/gcp; then echo "the gcp plan leaked a credential"; exit 1; fi
          rm -rf gcp-out
          node src/cli.js run --src test/fixtures/repeat-site --out az-out --site true --azure true
          test -f az-out/azure/main.tf || { echo "no azure terraform plan"; exit 1; }
          grep -qiE "storage|front_?door|cdn" az-out/azure/main.tf || { echo "the azure plan names no storage or Front Door"; exit 1; }
          if grep -rniE "AccountKey=|DefaultEndpointsProtocol=.*AccountKey|SharedAccessSignature" az-out/azure; then echo "the azure plan leaked a connection string"; exit 1; fi
          rm -rf az-out
          node src/cli.js run --src test/fixtures/repeat-site --out nocloud-out --site true
          if [ -d nocloud-out/gcp ] || [ -d nocloud-out/azure ]; then echo "a cloud plan ran unrequested"; exit 1; fi
          rm -rf nocloud-out

      - name: the Cloudflare, Vercel and Netlify deploy plans emit their redirects and take no secrets
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out host-out --site true --cloudflare true --vercel true --netlify true
          grep -q "301" host-out/cloudflare/_redirects || { echo "the cloudflare redirects are missing"; exit 1; }
          grep -q "permanent" host-out/vercel/vercel.json || { echo "the vercel permanent redirects are missing"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('host-out/vercel/vercel.json','utf8'))" || { echo "vercel.json is not valid JSON"; exit 1; }
          grep -q "301" host-out/netlify/_redirects || { echo "the netlify redirects are missing"; exit 1; }
          if grep -rniE "CLOUDFLARE_API_TOKEN\s*=\s*[\"'][A-Za-z0-9_-]{20,}|VERCEL_TOKEN\s*=\s*[\"'][A-Za-z0-9]|NETLIFY_AUTH_TOKEN\s*=\s*[\"'][A-Za-z0-9]" host-out; then echo "a host plan leaked a token"; exit 1; fi
          rm -rf host-out
          node src/cli.js run --src test/fixtures/repeat-site --out nohost-out --site true
          if [ -d nohost-out/cloudflare ] || [ -d nohost-out/vercel ] || [ -d nohost-out/netlify ]; then echo "a host plan ran unrequested"; exit 1; fi
          rm -rf nohost-out

      - name: the debug output and the global pollution are named, not deleted
        run: |
          node src/cli.js run --src test/fixtures/debt-site --out cln-out
          grep -qE "console\.(log|debug|warn)" cln-out/CONSOLE.md || { echo "a console call was missed"; exit 1; }
          grep -q "debugger" cln-out/CONSOLE.md || { echo "a debugger statement was missed"; exit 1; }
          grep -qE "APP_CONFIG|trackEvent" cln-out/GLOBALS.md || { echo "a global assignment was missed"; exit 1; }
          grep -q "wobble" cln-out/GLOBALS.md || { echo "the jQuery plugin was missed"; exit 1; }
          rm -rf cln-out

      - name: the port carries a type surface and an end to end suite
        run: |
          node src/cli.js run --src example/legacy --shots example/screenshots --out ty-out --types true
          grep -q "interface AppOrdersProps" ty-out/src/types/props.d.ts || { echo "the prop interface is missing"; exit 1; }
          if grep -qE ":\s*any\b" ty-out/src/types/props.d.ts; then echo "any leaked into the types"; exit 1; fi
          grep -q "type ApiPath" ty-out/src/types/api.d.ts || { echo "the endpoint union is missing"; exit 1; }
          rm -rf ty-out
          node src/cli.js run --src test/fixtures/repeat-site --out cy-out --site true --cypress true
          grep -q "cy.visit(" cy-out/cypress/e2e/routes.cy.js || { echo "the route walk is missing"; exit 1; }
          grep -q "cy.location" cy-out/cypress/e2e/redirects.cy.js || { echo "the redirect assertions are missing"; exit 1; }
          for f in cy-out/cypress.config.js cy-out/cypress/e2e/*.cy.js; do node --check "$f"; done
          rm -rf cy-out

      - name: the landmark structure and the unlabelled controls are named
        run: |
          node src/cli.js run --src test/fixtures/a11y-site --out a11-out
          grep -qi "main" a11-out/LANDMARKS.md || { echo "the landmark audit is missing"; exit 1; }
          grep -qE "username|remember|team" a11-out/LABELS.md || { echo "an unlabelled control was missed"; exit 1; }
          grep -qi "placeholder" a11-out/LABELS.md || { echo "the placeholder note is missing"; exit 1; }
          rm -rf a11-out

      - name: what blocks first paint and what is inline are named
        run: |
          node src/cli.js run --src test/fixtures/paint-site --out paint-out
          grep -q "analytics.js" paint-out/RENDER.md || { echo "a blocking script was missed"; exit 1; }
          grep -qi "import" paint-out/RENDER.md || { echo "the css import was missed"; exit 1; }
          grep -qiE "CSP|token|theme" paint-out/INLINE.md || { echo "the inline framing is missing"; exit 1; }
          rm -rf paint-out

      - name: the tangled functions and the magic values are named
        run: |
          node src/cli.js run --src test/fixtures/shape-site --out shape-out
          grep -q "process" shape-out/COMPLEXITY.md || { echo "the tangled function was missed"; exit 1; }
          grep -qi "approximation" shape-out/COMPLEXITY.md || { echo "the numbers do not say they are approximate"; exit 1; }
          grep -q "4999" shape-out/MAGIC.md || { echo "a magic threshold was missed"; exit 1; }
          grep -q "PENDING_REVIEW" shape-out/MAGIC.md || { echo "a magic status string was missed"; exit 1; }
          rm -rf shape-out

      - name: the module graph and its cycles, and the async to straighten, are named
        run: |
          node src/cli.js run --src test/fixtures/wiring-site --out wiring-out
          grep -qiE "cycle" wiring-out/IMPORTS.md || { echo "the import cycle section is missing"; exit 1; }
          grep -q "billing.js" wiring-out/IMPORTS.md || { echo "an internal edge was missed"; exit 1; }
          grep -qiE "callback|promise|await" wiring-out/ASYNC.md || { echo "the async findings are missing"; exit 1; }
          rm -rf wiring-out

      - name: the transformer runs on request and the codemod moves only what it proves
        run: |
          node src/cli.js run --src test/fixtures/codemod-site --out tf-out --transformer true --codemod true
          test -f tf-out/ATTENTION.md || { echo "the transformer wrote no attention"; exit 1; }
          grep -qiE "attention|head" tf-out/ATTENTION.md || { echo "the attention drawing is missing"; exit 1; }
          test -f tf-out/codemod/cart.js || { echo "the codemod wrote no transformed file"; exit 1; }
          grep -q "import" tf-out/codemod/cart.js || { echo "a require was not lifted to import"; exit 1; }
          grep -qiE "refus|dynamic" tf-out/CODEMOD.md || { echo "the dynamic require refusal is missing"; exit 1; }
          rm -rf tf-out
          node src/cli.js run --src test/fixtures/codemod-site --out plain-out
          test -f plain-out/ATTENTION.md && { echo "the transformer ran unrequested"; exit 1; }
          test -d plain-out/codemod && { echo "the codemod ran unrequested"; exit 1; }
          rm -rf plain-out

      - name: the transformer trains and proves it learned
        run: |
          node src/cli.js run --src test/fixtures/codemod-site --out train-out --train true
          test -f train-out/TRAINING.md || { echo "training wrote no report"; exit 1; }
          grep -qiE "loss" train-out/TRAINING.md || { echo "the loss curve is missing"; exit 1; }
          grep -qE "100%" train-out/TRAINING.md || { echo "the learned accuracy is missing"; exit 1; }
          grep -qiE "the legacy app into react" train-out/TRAINING.md || { echo "the learned sequence is missing"; exit 1; }
          rm -rf train-out
          node src/cli.js run --src test/fixtures/codemod-site --out notrain-out
          test -f notrain-out/TRAINING.md && { echo "training ran unrequested"; exit 1; }
          rm -rf notrain-out

      - name: the transformer memorizes arithmetic and generalizes an algorithm, honestly
        run: |
          node src/cli.js run --src test/fixtures/codemod-site --out math-out --train-math true --train-reverse true
          test -f math-out/MATH.md || { echo "no math report"; exit 1; }
          test -f math-out/REVERSE.md || { echo "no reverse report"; exit 1; }
          grep -qiE "memoriz" math-out/MATH.md || { echo "the math report does not state the memorization honestly"; exit 1; }
          grep -qiE "generaliz" math-out/REVERSE.md || { echo "the reverse report does not claim generalization"; exit 1; }
          grep -qiE "held out" math-out/REVERSE.md || { echo "the reverse report has no held out grade"; exit 1; }
          rm -rf math-out
          node src/cli.js run --src test/fixtures/codemod-site --out nomath-out
          if [ -f nomath-out/MATH.md ] || [ -f nomath-out/REVERSE.md ]; then echo "a math task ran unrequested"; exit 1; fi
          rm -rf nomath-out

      - name: the transformer learns to sort and generalizes, honestly
        run: |
          node src/cli.js run --src test/fixtures/codemod-site --out sort-out --train-sort true
          test -f sort-out/SORT.md || { echo "no sort report"; exit 1; }
          grep -qiE "held out" sort-out/SORT.md || { echo "the sort report has no held out grade"; exit 1; }
          grep -qiE "generaliz|partial" sort-out/SORT.md || { echo "the sort report does not state the honest verdict"; exit 1; }
          rm -rf sort-out
          node src/cli.js run --src test/fixtures/codemod-site --out nosort-out
          if [ -f nosort-out/SORT.md ]; then echo "the sort task ran unrequested"; exit 1; fi
          rm -rf nosort-out

      - name: the multi head model trains and reports whether the heads helped
        run: |
          node src/cli.js run --src test/fixtures/codemod-site --out mh-out --train-reverse-mh true
          test -f mh-out/REVERSE_MULTIHEAD.md || { echo "no multi head report"; exit 1; }
          grep -qiE "held out" mh-out/REVERSE_MULTIHEAD.md || { echo "the multi head report has no held out grade"; exit 1; }
          grep -qiE "head" mh-out/REVERSE_MULTIHEAD.md || { echo "the multi head report does not name the heads"; exit 1; }
          rm -rf mh-out
          node src/cli.js run --src test/fixtures/codemod-site --out nomh-out
          if [ -f nomh-out/REVERSE_MULTIHEAD.md ]; then echo "the multi head task ran unrequested"; exit 1; fi
          rm -rf nomh-out

      - name: the cloud architect refuses to reach the network without live authorization
        run: |
          # A billable live call to an external model must be refused by default,
          # never made silently. --architect without --allow-live must fail the run.
          if node src/cli.js run --src test/fixtures/codemod-site --out arch-out --architect true; then
            echo "general-architect reached the network without --allow-live"; exit 1
          fi
          test -f arch-out/ARCHITECTURE.md && { echo "it wrote a proposal it was not authorized to fetch"; exit 1; }
          rm -rf arch-out
          node src/cli.js run --src test/fixtures/codemod-site --out noarch-out
          test -f noarch-out/ARCHITECTURE.md && { echo "the architect ran unrequested"; exit 1; }
          rm -rf noarch-out

      - name: the agent system refuses to reach the network without live authorization
        run: |
          # A multi agent RAG pass over a real model is billable and live; it
          # must be refused by default, not made silently.
          if node src/cli.js run --src test/fixtures/codemod-site --out agents-out --agents true; then
            echo "general-agents reached the network without --allow-live"; exit 1
          fi
          test -f agents-out/AGENTS.md && { echo "it wrote an agent report it was not authorized to fetch"; exit 1; }
          rm -rf agents-out
          node src/cli.js run --src test/fixtures/codemod-site --out noagents-out
          test -f noagents-out/AGENTS.md && { echo "the agents ran unrequested"; exit 1; }
          rm -rf noagents-out

      - name: the ceiling gate fails a run over it, and only when asked
        run: |
          if node src/cli.js run --src example/legacy --out ceiling-out --max-unverified 0; then
            echo "the ceiling did not fire"; exit 1
          fi
          node src/cli.js run --src example/legacy --out ceiling-out
          rm -rf ceiling-out

      - name: the roadmap count is the number the file claims
        run: |
          count=$(grep -c '^\*\*[0-9]*\. ' ROADMAP.md)
          if [ "$count" != "541" ]; then
            echo "ROADMAP.md holds $count entries and claims 541"; exit 1
          fi
