name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - name: syntax check every source file
        run: for f in $(find src plugins -name '*.js'); do node --check "$f"; done
      - name: plugins load
        run: node src/cli.js plugins
      - name: pipeline runs end to end
        run: npm run demo
      - name: policy gate stops on a committed secret
        run: |
          echo 'const c = { client_secret: "sk_live_notarealvalue1234" };' > example/legacy/src/app/leak.ts
          if npm run demo; then echo "policy gate did not fire"; exit 1; fi
          rm example/legacy/src/app/leak.ts
          echo "policy gate fired as expected"
