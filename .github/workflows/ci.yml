      - name: the observers reader names an undisconnected observer
        run: |
          mkdir -p ob-src
          printf '%s\n' '<script>const io = new IntersectionObserver(onSee); io.observe(el);</script>' > ob-src/page.html
          node src/cli.js run --src ob-src --out ob-out
          test -f ob-out/OBSERVERS.md || { echo "no observers report"; exit 1; }
          grep -q "IntersectionObserver" ob-out/OBSERVERS.md || { echo "the observer was not named"; exit 1; }
          grep -q "no .disconnect" ob-out/OBSERVERS.md || { echo "the unclosed observer was not flagged"; exit 1; }
          rm -rf ob-src ob-out

      - name: the focus reader names a positive tabindex
        run: |
          mkdir -p fo-src
          printf '%s\n' '<div tabindex="3">jumps the queue</div>' > fo-src/page.html
          node src/cli.js run --src fo-src --out fo-out
          test -f fo-out/FOCUS.md || { echo "no focus report"; exit 1; }
          grep -q "tabindex 3" fo-out/FOCUS.md || { echo "the positive tabindex was not named"; exit 1; }
          rm -rf fo-src fo-out

      - name: the media reader names an uncaptioned video
        run: |
          mkdir -p me-src
          printf '%s\n' '<video src="clip.mp4" autoplay></video>' > me-src/page.html
          node src/cli.js run --src me-src --out me-out
          test -f me-out/MEDIA.md || { echo "no media report"; exit 1; }
          grep -q "no captions track" me-out/MEDIA.md || { echo "the uncaptioned video was not flagged"; exit 1; }
          rm -rf me-src me-out

      - name: the tables reader names an uncaptioned data table
        run: |
          mkdir -p ta-src
          printf '%s\n' '<table><tr><th scope="col">Q</th></tr><tr><td>1</td></tr></table>' > ta-src/page.html
          node src/cli.js run --src ta-src --out ta-out
          test -f ta-out/TABLES.md || { echo "no tables report"; exit 1; }
          grep -q "no caption" ta-out/TABLES.md || { echo "the uncaptioned table was not flagged"; exit 1; }
          rm -rf ta-src ta-out

      - name: the iframes reader names an untitled iframe
        run: |
          mkdir -p if-src
          printf '%s\n' '<iframe src="https://widget.vendor.com/w"></iframe>' > if-src/page.html
          node src/cli.js run --src if-src --out if-out
          test -f if-out/IFRAMES.md || { echo "no iframes report"; exit 1; }
          grep -q "no title" if-out/IFRAMES.md || { echo "the untitled iframe was not flagged"; exit 1; }
          rm -rf if-src if-out

      - name: the accessibility scorecard gathers the axes
        run: |
          mkdir -p ax-src
          printf '%s\n' '<video src="clip.mp4"></video><iframe src="https://v.com/x"></iframe>' > ax-src/page.html
          node src/cli.js run --src ax-src --out ax-out
          test -f ax-out/ACCESSIBILITY.md || { echo "no accessibility scorecard"; exit 1; }
          grep -q "item(s) flagged across" ax-out/ACCESSIBILITY.md || { echo "the scorecard did not tally"; exit 1; }
          rm -rf ax-src ax-out

      - name: the custom-element reader lowers a vanilla component
        run: |
          mkdir -p wc-src
          printf '%s\n' 'class XCard extends HTMLElement { static get observedAttributes(){return ["title"];} connectedCallback(){ this.innerHTML = `<h2>${this.title}</h2>`; } } customElements.define("x-card", XCard);' > wc-src/card.js
          node src/cli.js run --src wc-src --out wc-out
          test -d wc-out/src || { echo "no port emitted"; exit 1; }
          grep -rq "XCard" wc-out/src || { echo "the custom element was not ported"; exit 1; }
          rm -rf wc-src wc-out

      - name: the security scorecard gathers the concerns
        run: |
          mkdir -p sc-src
          printf '%s\n' '<a href="x" onclick="go()">x</a><script src="https://cdn.example.com/a.js"></script>' > sc-src/page.html
          node src/cli.js run --src sc-src --out sc-out
          test -f sc-out/SECURITY_SCORECARD.md || { echo "no security scorecard"; exit 1; }
          grep -q "item(s) flagged across" sc-out/SECURITY_SCORECARD.md || { echo "the scorecard did not tally"; exit 1; }
          rm -rf sc-src sc-out

      - name: the performance scorecard gathers the concerns and shows weight
        run: |
          mkdir -p pf-src
          printf '%s\n' '<head><script src="a.js"></script></head><body><img src="hero.jpg"></body>' > pf-src/page.html
          node src/cli.js run --src pf-src --out pf-out
          test -f pf-out/PERFORMANCE.md || { echo "no performance scorecard"; exit 1; }
          grep -q "item(s) flagged across" pf-out/PERFORMANCE.md || { echo "the scorecard did not tally"; exit 1; }
          grep -q "not summed" pf-out/PERFORMANCE.md || { echo "the port's weight was summed into the items"; exit 1; }
          rm -rf pf-src pf-out

      - name: publish-check proves the package packs clean, and never publishes
        run: |
          node src/cli.js publish-check
          grep -q '"publish"' plugins/general-publish/index.js && { echo "publish-check must never invoke npm publish"; exit 1; } || true

      - name: --max-security fails a leaky page at zero and passes it under a real ceiling
        run: |
          mkdir -p mx-src
          printf '%s\n' '<a href="x" onclick="go()">x</a><script src="https://cdn.example.com/a.js"></script>' > mx-src/page.html
          if node src/cli.js run --src mx-src --out mx-out --max-security 0 2>mx-err.txt; then echo "a ceiling of zero did not fail the leaky page"; exit 1; fi
          grep -q "security item(s) against a ceiling of 0" mx-err.txt || { echo "the failure did not name the ceiling"; exit 1; }
          rm -rf mx-out
          node src/cli.js run --src mx-src --out mx-out --max-security 99 || { echo "a real ceiling failed a page under it"; exit 1; }
          rm -rf mx-src mx-out mx-err.txt

      - name: --max-perf fails a heavy page at zero and passes it under a real ceiling
        run: |
          mkdir -p mp-src
          printf '%s\n' '<html><head><script src="a.js"></script></head><body><img src="hero.jpg"></body></html>' > mp-src/page.html
          if node src/cli.js run --src mp-src --out mp-out --max-perf 0 2>mp-err.txt; then echo "a ceiling of zero did not fail the heavy page"; exit 1; fi
          grep -q "performance item(s) against a ceiling of 0" mp-err.txt || { echo "the failure did not name the ceiling"; exit 1; }
          rm -rf mp-out
          node src/cli.js run --src mp-src --out mp-out --max-perf 99 || { echo "a real ceiling failed a page under it"; exit 1; }
          rm -rf mp-src mp-out mp-err.txt

      - name: the lifecycle scorecard gathers the teardown axes
        run: |
          mkdir -p lc-src
          printf '%s\n' 'window.addEventListener("resize", onResize); setInterval(tick, 1000);' > lc-src/widget.js
          node src/cli.js run --src lc-src --out lc-out
          test -f lc-out/LIFECYCLE_SCORECARD.md || { echo "no lifecycle scorecard"; exit 1; }
          grep -q "leak(s) flagged across" lc-out/LIFECYCLE_SCORECARD.md || { echo "the scorecard did not tally"; exit 1; }
          rm -rf lc-src lc-out

      - name: --max-leaks fails a leaky script at zero and passes it under a real ceiling
        run: |
          mkdir -p ml-src
          printf '%s\n' 'window.addEventListener("resize", onResize); setInterval(tick, 1000); const io = new IntersectionObserver(onSee);' > ml-src/widget.js
          if node src/cli.js run --src ml-src --out ml-out --max-leaks 0 2>ml-err.txt; then echo "a ceiling of zero did not fail the leaky script"; exit 1; fi
          grep -q "leak(s) against a ceiling of 0" ml-err.txt || { echo "the failure did not name the ceiling"; exit 1; }
          rm -rf ml-out
          node src/cli.js run --src ml-src --out ml-out --max-leaks 99 || { echo "a real ceiling failed a script under it"; exit 1; }
          rm -rf ml-src ml-out ml-err.txt

      - name: the eleventy target arranges the site with its redirects
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out el-out --site true --eleventy true
          test -f el-out/eleventy/_includes/layout.njk || { echo "no eleventy layout"; exit 1; }
          test -f el-out/eleventy/pages/about.njk || { echo "no eleventy page"; exit 1; }
          grep -q "{% raw %}" el-out/eleventy/pages/about.njk || { echo "the ported markup is not wrapped in raw"; exit 1; }
          grep -q "301" el-out/eleventy/pages/_redirects.njk || { echo "eleventy lost the redirect map"; exit 1; }
          rm -rf el-out

      - name: the ember reader ports a component and hands plain handlebars to its own reader
        run: |
          node src/cli.js run --src test/fixtures/ember --out em-out
          test -f em-out/src/features/UserCard/UserCard.jsx || { echo "the Ember component was not ported"; exit 1; }
          test -f em-out/src/features/Plain/Plain.jsx || { echo "the plain .hbs template was not ported"; exit 1; }
          grep -q "ng-repeat" em-out/src/features/UserCard/UserCard.jsx && { echo "the dialect leaked into the React output"; exit 1; } || true
          rm -rf em-out

      - name: the env reader names every key and repeats no value
        run: |
          node src/cli.js run --src test/fixtures/env-app --out en-out
          test -f en-out/ENV.md || { echo "no ENV.md"; exit 1; }
          test -f en-out/.env.example || { echo "no .env.example"; exit 1; }
          grep -q "^VITE_SENTRY_DSN=$" en-out/.env.example || { echo "the undeclared key is missing or carries a value"; exit 1; }
          grep -rq "localhost:9999" en-out && { echo "a value from the live .env leaked into the port"; exit 1; } || true
          rm -rf en-out

      - name: the dependency reader dates a library by what its project published
        run: |
          node src/cli.js run --src test/fixtures/deps-app --out dp-out
          test -f dp-out/DEPENDENCIES.md || { echo "no DEPENDENCIES.md"; exit 1; }
          grep -q "end of life since 2021-12-31" dp-out/DEPENDENCIES.md || { echo "AngularJS was not dated"; exit 1; }
          grep -q "not assessed" dp-out/DEPENDENCIES.md || { echo "an unknown library was not marked not assessed"; exit 1; }
          rm -rf dp-out

      - name: the mithril reader walks hyperscript onto React, with the child event wired
        run: |
          node src/cli.js run --src test/fixtures/mithril --out mi-out
          test -f mi-out/src/features/OrderList/OrderList.jsx || { echo "the Mithril component was not ported"; exit 1; }
          grep -q "onClear={() => onClear(order)}" mi-out/src/features/OrderList/OrderList.jsx || { echo "the child component's event was not wired"; exit 1; }
          grep -q "ng-" mi-out/src/features/OrderList/OrderList.jsx && { echo "the dialect leaked into the React output"; exit 1; } || true
          rm -rf mi-out

      - name: the platform reader names a removed API and what replaced it
        run: |
          node src/cli.js run --src test/fixtures/platform-app --out pf-out
          test -f pf-out/PLATFORM.md || { echo "no PLATFORM.md"; exit 1; }
          grep -q "Web SQL (openDatabase)" pf-out/PLATFORM.md || { echo "Web SQL was not named"; exit 1; }
          grep -q "IndexedDB" pf-out/PLATFORM.md || { echo "the replacement was not named"; exit 1; }
          rm -rf pf-out

      - name: the marko reader lowers control tags and bare bindings onto React
        run: |
          node src/cli.js run --src test/fixtures/marko --out mk-out
          test -f mk-out/src/features/UserCard/UserCard.jsx || { echo "the Marko component was not ported"; exit 1; }
          grep -q "onClear=" mk-out/src/features/UserCard/UserCard.jsx || { echo "the child component's event was not wired"; exit 1; }
          grep -q "ng-" mk-out/src/features/UserCard/UserCard.jsx && { echo "the dialect leaked into the React output"; exit 1; } || true
          rm -rf mk-out

      - name: the liquid reader wraps a template in its layout and inlines its sections
        run: |
          node src/cli.js run --src test/fixtures/liquid --out lq-out
          test -f lq-out/src/features/TemplatesProduct/TemplatesProduct.jsx || { echo "the Liquid template was not ported"; exit 1; }
          grep -q "<header" lq-out/src/features/TemplatesProduct/TemplatesProduct.jsx || { echo "the layout's header section was not composed in"; exit 1; }
          grep -qE "ng-|\{%" lq-out/src/features/TemplatesProduct/TemplatesProduct.jsx && { echo "the dialect or a liquid tag leaked into the React output"; exit 1; } || true
          rm -rf lq-out

      - name: the DOM reader measures a wide and a deep page against the published thresholds
        run: |
          node src/cli.js run --src test/fixtures/dom-site --out dm-out
          test -f dm-out/DOM.md || { echo "no DOM.md"; exit 1; }
          grep -q "over 60" dm-out/DOM.md || { echo "the wide parent was not flagged"; exit 1; }
          grep -q "over 32" dm-out/DOM.md || { echo "the deep nest was not flagged"; exit 1; }
          grep -q "DOM size" dm-out/PERFORMANCE.md || { echo "the scorecard has no DOM axis"; exit 1; }
          rm -rf dm-out

      - name: the playwright suite walks the routes and starts the port's own server
        run: |
          node src/cli.js run --src test/fixtures/repeat-site --out pw-out --site true --playwright true
          grep -q "page.goto(" pw-out/tests/e2e/routes.spec.js || { echo "the route walk is missing"; exit 1; }
          grep -q "toHaveURL" pw-out/tests/e2e/redirects.spec.js || { echo "the redirect assertions are missing"; exit 1; }
          grep -q "npm run serve" pw-out/playwright.config.js || { echo "the config does not start the port's server"; exit 1; }
          for f in pw-out/playwright.config.js pw-out/tests/e2e/*.spec.js; do node --check "$f"; done
          rm -rf pw-out

      - name: the twig reader composes a page into its layout through the jinja lowering
        run: |
          node src/cli.js run --src test/fixtures/twig --out tw-out
          test -f tw-out/src/features/TemplatesProduct/TemplatesProduct.jsx || { echo "the Twig template was not ported"; exit 1; }
          grep -q "<nav" tw-out/src/features/TemplatesProduct/TemplatesProduct.jsx || { echo "the layout's include was not composed in"; exit 1; }
          grep -qE "ng-|\{%" tw-out/src/features/TemplatesProduct/TemplatesProduct.jsx && { echo "the dialect or a twig tag leaked into the React output"; exit 1; } || true
          rm -rf tw-out

      - name: the xslt reader lowers a stylesheet onto React with the document as its input
        run: |
          node src/cli.js run --src test/fixtures/xslt --out xs-out
          test -f xs-out/src/features/Catalog/Catalog.jsx || { echo "the stylesheet was not ported"; exit 1; }
          grep -q "data.catalog.item.map(" xs-out/src/features/Catalog/Catalog.jsx || { echo "the for-each did not become a loop"; exit 1; }
          grep -qE "ng-|xsl:" xs-out/src/features/Catalog/Catalog.jsx && { echo "the dialect or xsl leaked into the React output"; exit 1; } || true
          rm -rf xs-out

      - name: the blade reader composes a view into its layout and ports it once
        run: |
          node src/cli.js run --src test/fixtures/blade --out bl-out
          test -f bl-out/src/features/ProductsShow/ProductsShow.jsx || { echo "the Blade view was not ported"; exit 1; }
          grep -q "<nav" bl-out/src/features/ProductsShow/ProductsShow.jsx || { echo "the layout's partial was not composed in"; exit 1; }
          grep -qE "ng-|@endsection|@csrf" bl-out/src/features/ProductsShow/ProductsShow.jsx && { echo "the dialect or a directive leaked into the React output"; exit 1; } || true
          rm -rf bl-out

      - name: the roadmap count is the number the file claims
        run: |
          count=$(grep -c '^\*\*[0-9]*\. ' ROADMAP.md)
          if [ "$count" != "587" ]; then
            echo "ROADMAP.md holds $count entries and claims 587"; exit 1
          fi
