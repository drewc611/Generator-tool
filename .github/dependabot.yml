version: 2
updates:
  # There are no runtime dependencies to update, which is the point. The
  # actions in the workflows are the one place versions creep in.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    labels: ["ci"]

  # Nothing is installed at runtime, so this only ever sees the optional
  # dependencies: playwright and typescript.
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    commit-message: { prefix: "deps" }
    labels: ["dependencies"]
    open-pull-requests-limit: 3
