<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101013" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>portamp</title>
<style>
  /* Original artwork in the late 90s skinned player genre. Nothing here is
     traced from, or copied out of, any real player skin. */
  :root {
    --chassis-hi: #3f3f47; --chassis-lo: #1d1d22; --face: #2b2b31;
    --edge-hi: #63636f; --edge-lo: #0a0a0c;
    --lcd: #04120b; --lcd-edge: #0d3a24;
    --p-hi: #7df3b0; --p-mid: #3fbf7f; --p-dim: #237a52;
    --amber: #f0a830; --amber-dim: #9c6c1d;
    --sel: #1b3d6b; --ink: #d7d7de; --muted: #8b8b96; --faint: #5d5d68;
    --input: #6ee7a8; --dsp: #7dd3fc; --output: #f0a830; --vis: #c4b5fd; --general: #fb7185;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100vh; overflow: hidden; padding: 5px; gap: 5px;
    background: #101013; color: var(--ink);
    font: 11px/1.45 var(--mono); letter-spacing: .2px;
    display: grid; grid-template-columns: 276px 1fr;
    grid-template-rows: 42px 128px minmax(0, 1fr) minmax(0, 168px);
    grid-template-areas: "head head" "deck compare" "rack compare" "rack notes";
  }

  /* A phone gets the same console, stacked. The desktop grid clips to the
     viewport because it is a deck; a phone scrolls because it is a page. */
  @media (max-width: 760px) {
    body {
      height: auto; min-height: 100vh; overflow: auto;
      grid-template-columns: 1fr;
      grid-template-rows: 42px auto auto auto auto;
      grid-template-areas: "head" "deck" "compare" "rack" "notes";
    }
    /* min-width breaks the grid blowout: a wide deck scrolls inside its own
       unit instead of widening the page. */
    .unit { min-height: 200px; min-width: 0; overflow-x: auto; }
  }

  /* the chassis: light on top and left, dark on bottom and right */
  .unit {
    background: linear-gradient(180deg, var(--chassis-hi), var(--chassis-lo));
    border-top: 1px solid var(--edge-hi); border-left: 1px solid var(--edge-hi);
    border-right: 1px solid var(--edge-lo); border-bottom: 1px solid var(--edge-lo);
    display: flex; flex-direction: column; min-height: 0; padding: 4px;
  }
  .sunk {
    background: var(--lcd);
    border-top: 1px solid var(--edge-lo); border-left: 1px solid var(--edge-lo);
    border-right: 1px solid #4a4a54; border-bottom: 1px solid #4a4a54;
    min-height: 0; display: flex; flex-direction: column;
  }
  .cap {
    font-size: 8.5px; letter-spacing: 1.7px; text-transform: uppercase; color: var(--faint);
    padding: 0 2px 3px; display: flex; justify-content: space-between; align-items: center; flex: none;
  }
  .cap b { color: var(--amber); font-weight: 700; }
  .scroll { overflow: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: #4a4a54 var(--lcd); }

  /* head: titlebar, display, analyser */
  .head { grid-area: head; flex-direction: row; align-items: stretch; gap: 5px; padding: 3px; }
  .grille { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 6px; }
  .grille i { display: block; height: 1px; background: var(--edge-hi); opacity: .3; }
  .wordmark {
    color: var(--amber); font-weight: 700; letter-spacing: 4px; font-size: 14px;
    padding: 0 10px; display: flex; align-items: center; text-shadow: 0 1px 0 #0008;
  }
  .readout { width: 300px; padding: 3px 8px; justify-content: center; }
  .readout .now { color: var(--p-hi); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .readout .sub { color: var(--p-dim); font-size: 9.5px; }
  .gauges { display: flex; gap: 5px; align-items: stretch; }
  .gauge { width: 62px; padding: 3px 6px; align-items: center; justify-content: center; text-align: center; }
  .gauge b { color: var(--amber); font-size: 15px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .gauge span { color: var(--faint); font-size: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .swatches { display: flex; gap: 2px; margin-bottom: 3px; }
  .swatches i { width: 11px; height: 11px; border: 1px solid var(--edge-lo); display: block; }
  .lamps { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 4px; }
  .lamp { width: 7px; height: 7px; border-radius: 50%; background: #16161a; border: 1px solid var(--edge-lo); }
  .lamp.on { background: var(--p-mid); box-shadow: 0 0 4px var(--p-mid); }
  .lamp.warn { background: var(--amber); box-shadow: 0 0 4px var(--amber); }

  /* deck: stage analyser and transport */
  .deck { grid-area: deck; }
  .analyser { display: flex; gap: 3px; padding: 5px 6px; flex: 1; align-items: flex-end; }
  .col { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; justify-content: flex-start; }
  .col i { display: block; height: 5px; background: #14251c; border-radius: 1px; }
  .col i.lit { background: var(--p-mid); }
  .col i.peak { background: var(--amber); }
  .col em { font-style: normal; color: var(--p-dim); font-size: 8px; letter-spacing: .8px; text-align: center; margin-top: 3px; }
  .transport { display: flex; gap: 3px; padding: 4px 0 0; flex: none; }
  .key {
    flex: 1; text-align: center; padding: 4px 0; font-size: 8.5px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted); background: linear-gradient(180deg, #46464f, #2a2a30);
    border-top: 1px solid var(--edge-hi); border-left: 1px solid var(--edge-hi);
    border-right: 1px solid var(--edge-lo); border-bottom: 1px solid var(--edge-lo);
  }
  .key.done { color: var(--p-hi); }
  .key { cursor: pointer; user-select: none; }
  .key:hover { color: var(--amber); }
  .key[aria-pressed="true"] {
    color: var(--amber); background: linear-gradient(180deg, #2a2118, #171009);
    border-top-color: var(--edge-lo); border-left-color: var(--edge-lo);
    border-right-color: var(--edge-hi); border-bottom-color: var(--edge-hi);
  }
  .key:focus-visible { outline: 1px dotted var(--amber); outline-offset: 1px; }
  .run { flex: 0 0 62px; color: var(--p-hi); }
  .run.busy { color: var(--amber); }

  /* rack and screens: the playlist */
  .rack { grid-area: rack; }
  .row { display: flex; gap: 6px; padding: 2px 6px; align-items: baseline; }
  .row:nth-child(odd) { background: #071008; }
  .grp { color: var(--p-dim); font-size: 8.5px; letter-spacing: 1.6px; text-transform: uppercase; padding: 5px 6px 1px; }
  .num { color: var(--p-dim); width: 16px; text-align: right; flex: none; font-size: 10px; }
  .nm { color: var(--p-hi); }
  .ms { margin-left: auto; color: var(--p-dim); font-variant-numeric: tabular-nums; font-size: 10px; }
  .said { color: var(--p-mid); opacity: .72; font-size: 9.5px; padding: 0 6px 3px 28px; overflow-wrap: anywhere;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .c-input .nm { color: var(--input); } .c-dsp .nm { color: var(--dsp); }
  .c-output .nm { color: var(--output); } .c-vis .nm { color: var(--vis); } .c-general .nm { color: var(--general); }

  .screens { flex: none; margin-top: 4px; height: 38%; }
  .item {
    display: flex; gap: 6px; width: 100%; text-align: left; align-items: baseline;
    padding: 3px 6px; background: none; border: 0; color: var(--p-hi); font: inherit; cursor: pointer;
  }
  .item:nth-child(odd) { background: #071008; }
  .item[aria-current="true"] { background: var(--sel); color: #fff; }
  .item:focus-visible { outline: 1px dotted var(--amber); outline-offset: -1px; }
  .item .st { margin-left: auto; color: var(--p-dim); font-size: 9.5px; }
  .item[aria-current="true"] .st { color: #b8cdea; }

  /* comparison */
  .compare { grid-area: compare; }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; overflow: auto; }
  .layer img { display: block; width: 100%; height: auto; }
  .layer pre { margin: 0; padding: 8px 10px 30px; font-size: 10.5px; line-height: 1.6; tab-size: 2; color: var(--p-hi); }
  .layer .why { position: sticky; top: 0; z-index: 1; padding: 4px 10px; font-size: 9.5px; color: var(--p-dim);
                background: #07160e; border-bottom: 1px solid var(--lcd-edge); }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; gap: 5px; text-align: center; padding: 20px; color: var(--p-mid); }
  .empty strong { color: var(--p-hi); font-weight: 700; }
  .empty span { max-width: 44ch; font-size: 10px; color: var(--p-dim); }
  .seam { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--amber); pointer-events: none; box-shadow: 0 0 5px #f0a83088; }
  .flag { position: absolute; bottom: 6px; font-size: 8px; letter-spacing: 1.4px; text-transform: uppercase;
          color: var(--p-dim); background: #04120bd0; padding: 1px 5px; border: 1px solid var(--lcd-edge); pointer-events: none; }

  /* the wipe, as a slider with a groove and a chunky thumb */
  .slider { display: flex; align-items: center; gap: 7px; padding: 4px 2px 0; flex: none; }
  .slider label { color: var(--faint); font-size: 8px; letter-spacing: 1.2px; text-transform: uppercase; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 12px; background: none; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; background: #14141a;
    border-top: 1px solid var(--edge-lo); border-left: 1px solid var(--edge-lo);
    border-right: 1px solid #4a4a54; border-bottom: 1px solid #4a4a54;
  }
  input[type=range]::-moz-range-track {
    height: 6px; background: #14141a; border: 1px solid var(--edge-lo);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 18px; margin-top: -7px;
    background: linear-gradient(180deg, #55555f, #2c2c33);
    border-top: 1px solid var(--edge-hi); border-left: 1px solid var(--edge-hi);
    border-right: 1px solid var(--edge-lo); border-bottom: 1px solid var(--edge-lo);
  }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 18px; border-radius: 0;
    background: linear-gradient(180deg, #55555f, #2c2c33); border: 1px solid var(--edge-hi);
  }
  input[type=range]:focus-visible { outline: 1px dotted var(--amber); outline-offset: 2px; }

  /* endpoints and unverified */
  .cap input[type=search] { flex: 1; min-width: 0; margin: 0 8px; background: var(--sunk, #14161b); color: inherit;
    border: 1px solid rgba(255,255,255,.12); border-radius: 3px; font: inherit; font-size: 10px; padding: 2px 6px; }
  .notes { grid-area: notes; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 6px; }
  tr:nth-child(odd) td { background: #071008; }
  .verb { color: var(--p-mid); width: 46px; font-size: 10px; }
  .verb.POST, .verb.PUT, .verb.PATCH { color: var(--amber); }
  .verb.DELETE { color: #fb7185; }
  .path { color: var(--p-hi); }
  .src { text-align: right; color: var(--p-dim); font-size: 9px; }
  .src.observed { color: var(--dsp); }
  .unver li { margin: 0 0 2px; color: var(--amber); }
  .unver ul { margin: 0; padding: 4px 8px 6px 20px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; flex: 1; min-height: 0; }
  .hint { color: var(--p-dim); padding: 8px; }
  .k { color: #c4b5fd; } .s { color: var(--p-mid); } .c { color: var(--p-dim); font-style: italic; }
  .n { color: var(--amber); } .t { color: var(--dsp); }
</style>
</head>
<body>

<section class="unit head">
  <div class="wordmark">portamp</div>
  <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="sunk readout">
    <div class="now" id="now">no run loaded</div>
    <div class="sub" id="now-sub"></div>
  </div>
  <div class="gauges">
    <div class="sunk gauge"><b id="g-files">0</b><span>files</span></div>
    <div class="sunk gauge"><b id="g-plugins">0</b><span>plugins</span></div>
    <div class="sunk gauge"><b id="g-ms">0</b><span>ms</span></div>
    <div class="sunk gauge"><b id="g-unver">0</b><span>unver</span></div>
  </div>
  <div class="sunk gauge" style="width:auto;padding:3px 6px">
    <div class="swatches" id="swatches"></div>
    <span>tokens</span>
  </div>
  <div class="lamps"><i class="lamp on" title="run loaded"></i><i class="lamp" id="lamp-unver" title="unverified items"></i></div>
</section>

<section class="unit deck">
  <div class="cap"><span>plugins per stage</span><b id="deck-total"></b></div>
  <div class="sunk"><div class="analyser" id="analyser"></div></div>
  <div class="transport" id="transport"></div>
  <div class="transport">
    <button class="key run" id="run" title="Run the pipeline again">▶ run</button>
    <button class="key" id="all" aria-pressed="true">all stages</button>
  </div>
</section>

<section class="unit rack">
  <div class="cap"><span>plugin rack</span><b id="rack-total"></b></div>
  <div class="sunk"><div class="scroll" id="rack"></div></div>
  <div class="cap" style="padding-top:6px"><span>screens</span><b id="screen-total"></b></div>
  <div class="sunk screens"><div class="scroll" id="screens"></div></div>
</section>

<section class="unit compare">
  <div class="cap"><span id="cmp-name">side by side</span><b id="cmp-file"></b></div>
  <div class="sunk stage" id="stage">
    <div class="layer" id="layer-shot"></div>
    <div class="layer" id="layer-built"></div>
    <span class="flag" style="left:6px" id="flag-left">recorded</span>
    <span class="flag" style="right:6px" id="flag-right">built</span>
    <div class="seam" id="seam"></div>
  </div>
  <div class="slider" id="slider-wrap">
    <label for="wipe">wipe</label>
    <input id="wipe" type="range" min="0" max="100" value="50"
           aria-label="Wipe between the recorded screenshot and the built component" />
  </div>
</section>

<section class="unit notes">
  <div class="split">
    <div style="display:flex;flex-direction:column;min-height:0">
      <div class="cap"><span>endpoints</span><b id="ep-total"></b></div>
      <div class="sunk"><div class="scroll"><table id="endpoints"></table></div></div>
    </div>
    <div style="display:flex;flex-direction:column;min-height:0">
      <div class="cap"><span>unverified</span><input id="un-q" type="search" placeholder="/ to filter" aria-label="filter unverified items"><b id="un-total"></b></div>
      <div class="sunk unver"><div class="scroll"><ul id="unver"></ul></div></div>
    </div>
  </div>
</section>

<section class="unit">
  <div class="cap"><span>written files, and who wrote them</span><b id="files-total"></b></div>
  <div class="sunk"><div class="scroll"><table id="files-list"></table></div></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
// The quotes matter as much as the angle brackets: most of these values land
// inside a double quoted attribute, where a quote ends the attribute early.
const ENTITIES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ENTITIES[c]);
const CLASSES = ["input", "dsp", "output", "vis", "general"];
const STAGES = ["scan", "extract", "plan", "emit", "verify"];
let run = null;

/**
 * Enough of a tokenizer to make emitted JSX readable. One pass, because
 * sequential replacements match the markup the earlier ones inserted: `class`
 * is a keyword, and it appears in every span this function writes.
 */
const KEYWORDS = new Set(("import from export default const let var function return if else for of in await async " +
  "new class extends try catch finally throw typeof null undefined true false").split(" "));

function highlight(source) {
  const RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(<\/?)([A-Za-z][\w.]*)|([A-Za-z_$][\w$]*)|(\b\d+(?:\.\d+)?\b)/g;
  let out = "", last = 0, m;
  while ((m = RE.exec(source))) {
    out += esc(source.slice(last, m.index));
    if (m[1]) out += '<i class="c">' + esc(m[1]) + "</i>";
    else if (m[2]) out += '<i class="s">' + esc(m[2]) + "</i>";
    else if (m[3]) out += esc(m[3]) + '<i class="t">' + esc(m[4]) + "</i>";
    else if (m[5]) out += KEYWORDS.has(m[5]) ? '<i class="k">' + m[5] + "</i>" : esc(m[5]);
    else out += '<i class="n">' + esc(m[6]) + "</i>";
    last = RE.lastIndex;
  }
  return out + esc(source.slice(last));
}

/**
 * The recovered palette gets a swatch, not the chassis. Painting the chrome
 * with the ported app's accent is how the wordmark ends up unreadable, and a
 * UI you cannot read tells you nothing about the tokens either.
 */
function renderTokens() {
  const colours = run.tokens?.color ?? {};
  const roles = ["accent", "ink", "surface", "bg", "danger"].filter((r) => colours[r]);
  $("swatches").innerHTML = roles.map((role) =>
    '<i title="' + role + " " + esc(colours[role]) + '" style="background:' + esc(colours[role]) + '"></i>'
  ).join("") || '<em class="hint" style="padding:0;font-size:8px">no tokens</em>';
}

function renderHead() {
  const ms = run.plugins.reduce((t, p) => t + p.ms, 0);
  $("g-files").textContent = run.files.length;
  $("g-plugins").textContent = run.plugins.length;
  $("g-ms").textContent = ms;
  $("g-unver").textContent = run.unverified.length;
  $("now-sub").textContent = new Date(run.ranAt).toLocaleString();
  if (run.unverified.length) $("lamp-unver").classList.add("warn");
}

/** The bars are the plugin count for each stage. Nothing here is decorative. */
function renderDeck() {
  const perStage = STAGES.map((stage) => ({
    stage,
    n: new Set(run.plugins.filter((p) => p.stages.includes(stage)).map((p) => p.name)).size,
  }));
  const tallest = Math.max(1, ...perStage.map((s) => s.n));
  $("deck-total").textContent = run.plugins.length;
  $("analyser").innerHTML = perStage.map((s) => {
    const cells = Array.from({ length: tallest }, (_, k) => {
      const lit = k < s.n;
      return '<i class="' + (lit ? (k >= tallest - 2 ? "peak" : "lit") : "") + '"></i>';
    }).join("");
    return '<div class="col">' + cells + "<em>" + s.stage + "</em></div>";
  }).join("");
  $("transport").innerHTML = STAGES.map((s) =>
    '<button class="key done" data-stage="' + s + '" aria-pressed="false">' + s + "</button>"
  ).join("");
  for (const key of $("transport").children) {
    key.addEventListener("click", () => selectStage(key.dataset.stage));
  }
}

let stageFilter = null;

/** A transport key selects a stage. The rack shows what ran in it. */
function selectStage(stage) {
  stageFilter = stageFilter === stage ? null : stage;
  for (const key of $("transport").children) {
    key.setAttribute("aria-pressed", String(key.dataset.stage === stageFilter));
  }
  $("all").setAttribute("aria-pressed", String(stageFilter === null));
  const shown = run.plugins.filter((p) => !stageFilter || p.stages.includes(stageFilter));
  $("now").textContent = stageFilter
    ? stageFilter + " — " + shown.length + " plugin(s)"
    : run.screens.length ? run.screens[0].name : "run loaded";
  renderRack();
}

function renderRack() {
  const visible = run.plugins.filter((p) => !stageFilter || p.stages.includes(stageFilter));
  $("rack-total").textContent = stageFilter ? visible.length + "/" + run.plugins.length : run.plugins.length;
  let n = 0;
  $("rack").innerHTML = CLASSES.map((cls) => {
    const group = visible.filter((p) => p.class === cls);
    if (!group.length) return "";
    return '<div class="grp">' + cls + "</div>" + group.map((p) => {
      n += 1;
      return '<div class="c-' + cls + '">' +
        '<div class="row"><span class="num">' + n + ".</span>" +
        '<span class="nm">' + esc(p.name) + '</span><span class="ms">' + p.ms + "ms</span></div>" +
        '<div class="said">' + esc(p.contributed) + "</div></div>";
    }).join("");
  }).join("");
}

function renderScreens() {
  $("screen-total").textContent = run.screens.length;
  if (!run.screens.length) {
    $("screens").innerHTML = '<p class="hint">no components emitted</p>';
    return;
  }
  $("screens").innerHTML = run.screens.map((s, i) =>
    '<button class="item" data-i="' + i + '" aria-current="false">' +
      '<span class="num">' + (i + 1) + ".</span><span>" + esc(s.name) + "</span>" +
      '<span class="st">' + (s.origin === "observed" ? "observed" : s.matched ? esc(s.state || "shot") : "no shot") + "</span>" +
    "</button>"
  ).join("");
  for (const b of $("screens").children) b.addEventListener("click", () => select(Number(b.dataset.i)));
}

function renderEndpoints() {
  $("ep-total").textContent = run.endpoints.length;
  $("endpoints").innerHTML = run.endpoints.length
    ? run.endpoints.map((e) =>
        '<tr><td class="verb ' + esc(e.method) + '">' + esc(e.method) + "</td>" +
        '<td class="path">' + esc(e.path) + "</td>" +
        '<td class="src ' + esc(e.origin) + '">' + esc(e.origin) + "</td></tr>"
      ).join("")
    : '<tr><td class="hint">no endpoints found</td></tr>';
}

function renderUnverified() {
  const query = $("un-q").value.trim().toLowerCase();
  const shown = query ? run.unverified.filter((u) => u.toLowerCase().includes(query)) : run.unverified;
  $("un-total").textContent = query ? shown.length + "/" + run.unverified.length : run.unverified.length;
  $("unver").innerHTML = run.unverified.length
    ? (shown.length
        ? shown.map((u) => "<li>" + esc(u) + "</li>").join("")
        : '<li style="color:var(--p-dim)">nothing matches the filter.</li>')
    : '<li style="color:var(--p-dim)">nothing. every value came from the source or from the app itself.</li>';
}
$("un-q") && $("un-q").addEventListener("input", () => run && renderUnverified());

// Provenance came with the run: every file is attributed to the plugin whose
// turn it was when it landed, which is the kernel's memory, not a guess.
function renderFiles() {
  const files = run.files ?? [];
  $("files-total").textContent = files.length;
  $("files-list").innerHTML = files.length
    ? files.map((f) => {
        const who = (run.provenance ?? {})[f];
        return "<tr><td class=\"path\">" + esc(f) + "</td><td class=\"src\">" +
          (who ? esc(who.plugin) + " at " + esc(who.stage) : "unattributed") + "</td></tr>";
      }).join("")
    : '<tr><td class="hint">nothing written yet</td></tr>';
}

let currentIndex = 0;
async function select(index) {
  const screen = run.screens[index];
  currentIndex = index;
  for (const b of $("screens").children) b.setAttribute("aria-current", String(Number(b.dataset.i) === index));
  $("now").textContent = screen.name;
  $("cmp-name").textContent = screen.name;
  $("cmp-file").textContent = screen.component ?? "no component";

  if (screen.screenshot) {
    const img = new Image();
    img.alt = "Recorded screenshot of " + screen.name;
    img.src = "/shots/" + encodeURIComponent(screen.screenshot);
    // A file that exists but holds nothing is not a screenshot. Saying so beats
    // a blank rectangle that reads as a rendering bug.
    img.onerror = () => {
      $("layer-shot").innerHTML = '<div class="empty"><strong>' + esc(screen.screenshot) + " is a placeholder.</strong>" +
        "<span>The file is there but it is empty, so there is nothing to compare against. " +
        "Record the real screen before trusting any parity claim about it.</span></div>";
      setWipe(false);
    };
    $("layer-shot").replaceChildren(img);
  } else {
    $("layer-shot").innerHTML = '<div class="empty"><strong>No screenshot for this screen.</strong>' +
      "<span>Nothing was recorded for it, so there is nothing to compare against. " +
      "This state was designed rather than matched.</span></div>";
  }
  setWipe(Boolean(screen.screenshot));

  if (!screen.component) {
    $("layer-built").innerHTML = '<div class="empty"><strong>No component was emitted.</strong>' +
      "<span>This screen is in the model but nothing was written for it.</span></div>";
    return;
  }
  $("layer-built").innerHTML = '<pre class="hint">loading…</pre>';

  // The custom element target runs without a build, so when this run emitted
  // one for the screen, the pane can show real pixels instead of source. The
  // React source stays one toggle away.
  const compact = screen.name.replace(/-/g, "").toLowerCase();
  const element = (run.files ?? []).find(
    (f) => /^src\/elements\/[\w-]+\.js$/.test(f) && f.split("/").pop().replace(/\.js$/, "").toLowerCase().includes(compact)
  );
  try {
    if (element) return showPreview(screen, element, "empty");
    const source = await fetch("/source?path=" + encodeURIComponent(screen.component)).then((r) => r.text());
    $("layer-built").innerHTML = '<p class="why">This run emitted no custom element for the screen (--html true adds one), ' +
      "so this is the emitted source rather than pixels.</p><pre>" + highlight(source) + "</pre>";
  } catch {
    $("layer-built").innerHTML = '<div class="empty"><strong>Could not read the emitted file.</strong></div>';
  }
}

async function showPreview(screen, element, state) {
  const bar =
    '<div class="why" id="pv-bar">live element · state: ' +
    ["empty", "loading", "error"].map((s) =>
      '<button class="key" data-state="' + s + '" aria-pressed="' + String(s === state) + '">' + s + "</button>").join(" ") +
    ' <button class="key" id="pv-src">view source</button></div>';
  $("layer-built").innerHTML = bar +
    '<iframe title="live preview of ' + esc(screen.name) + '" style="border:0;width:100%;height:calc(100% - 30px);background:#fff"' +
    ' src="/preview?path=' + encodeURIComponent(element) + "&state=" + encodeURIComponent(state) + '"></iframe>';
  for (const button of $("pv-bar").querySelectorAll("button[data-state]")) {
    button.addEventListener("click", () => showPreview(screen, element, button.dataset.state));
  }
  $("pv-src").addEventListener("click", async () => {
    const source = await fetch("/source?path=" + encodeURIComponent(screen.component ?? element)).then((r) => r.text());
    $("layer-built").innerHTML = '<p class="why">emitted source. <button class="key" id="pv-back">back to preview</button></p>' +
      "<pre>" + highlight(source) + "</pre>";
    $("pv-back").addEventListener("click", () => showPreview(screen, element, state));
  });
}

/** Only offer a wipe when there are two things to wipe between. */
function setWipe(enabled) {
  $("slider-wrap").style.visibility = enabled ? "" : "hidden";
  for (const id of ["seam", "flag-left", "flag-right"]) $(id).style.display = enabled ? "" : "none";
  $("layer-built").style.clipPath = enabled ? null : "none";
  if (enabled) applyWipe();
}

function applyWipe() {
  const value = Number($("wipe").value);
  $("layer-built").style.clipPath = "inset(0 0 0 " + value + "%)";
  $("seam").style.left = value + "%";
  $("wipe").setAttribute("aria-valuetext", value + "% recorded");
}

$("wipe").addEventListener("input", applyWipe);
$("all").addEventListener("click", () => selectStage(null));

// Running the tool again is the one thing this window is allowed to cause.
$("run").addEventListener("click", async () => {
  const button = $("run");
  if (button.classList.contains("busy")) return;
  button.classList.add("busy");
  button.textContent = "· running";
  $("now").textContent = "running the pipeline";
  try {
    const result = await fetch("/rerun", { method: "POST" }).then((r) => r.json());
    if (!result.ok) {
      $("now").textContent = "stopped: " + (result.error ?? "unknown").split("\n")[0];
      $("lamp-unver").classList.add("warn");
      return;
    }
    run = await fetch("/run.json").then((r) => r.json());
    stageFilter = null;
    renderTokens(); renderHead(); renderDeck(); renderRack(); renderScreens(); renderEndpoints(); renderUnverified(); renderFiles();
    if (run.screens.length) select(0);
    $("now").textContent = "done in " + result.ms + "ms";
  } catch (err) {
    $("now").textContent = "could not run: " + err.message;
  } finally {
    button.classList.remove("busy");
    button.textContent = "▶ run";
  }
});

// The console is keyboard first: j/k or the arrows walk the screens, / jumps
// to the unverified filter. Keys inside an input belong to the input.
document.addEventListener("keydown", (event) => {
  if (!run || event.target.matches("input, textarea, select")) {
    if (event.key === "Escape" && event.target.id === "un-q") { event.target.value = ""; renderUnverified(); event.target.blur(); }
    return;
  }
  if (event.key === "/") { event.preventDefault(); $("un-q").focus(); return; }
  if (!run.screens.length) return;
  if (event.key === "j" || event.key === "ArrowDown") { event.preventDefault(); select(Math.min(currentIndex + 1, run.screens.length - 1)); }
  if (event.key === "k" || event.key === "ArrowUp") { event.preventDefault(); select(Math.max(currentIndex - 1, 0)); }
});

// A watch task rewrites run.json behind this window. Polling is enough: the
// console re-renders only when the run's timestamp actually moved, and the
// selection survives the refresh.
setInterval(async () => {
  if (!run) return;
  try {
    const fresh = await fetch("/run.json").then((r) => r.json());
    if (fresh.ranAt === run.ranAt) return;
    run = fresh;
    renderTokens(); renderHead(); renderDeck(); renderRack(); renderScreens(); renderEndpoints(); renderUnverified(); renderFiles();
    if (run.screens.length) select(Math.min(currentIndex, run.screens.length - 1));
    $("now-sub").textContent = "refreshed from a newer run";
  } catch { /* the server may be restarting; the next tick asks again */ }
}, 5000);

// One line of trend under the readout: the unverified count against the run
// before, from the history general-history keeps.
async function renderTrend() {
  try {
    const entries = await fetch("/history.json").then((r) => r.json());
    if (entries.length < 2) return;
    const delta = entries.at(-1).unverified - entries.at(-2).unverified;
    $("now-sub").textContent = delta === 0 ? "unverified: level with the previous run"
      : delta > 0 ? "unverified: +" + delta + " since the previous run"
      : "unverified: " + delta + " since the previous run";
  } catch { /* no history yet */ }
}

(async function start() {
  try {
    run = await fetch("/run.json").then((r) => r.json());
  } catch {
    $("now").textContent = "no run.json — run portamp first";
    return;
  }
  renderTrend();
  renderTokens();
  renderHead(); renderDeck(); renderRack(); renderScreens(); renderEndpoints(); renderUnverified(); renderFiles();
  if (run.screens.length) select(0);
  else {
    $("layer-shot").innerHTML = '<div class="empty"><strong>Nothing to compare.</strong><span>This run emitted no components.</span></div>';
    setWipe(false);
  }
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
</script>
</body>
</html>
